name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            runner: ubuntu-24.04
            browser-install: --with-deps chromium
          # Test WebKit's media stack on the OS used by the Buzz macOS webview.
          - project: webkit
            runner: macos-15
            browser-install: chromium webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install ${{ matrix.browser-install }}
      - run: npm run test:browser -- --project=${{ matrix.project }}
